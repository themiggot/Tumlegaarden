name: Byg og udgiv

# Bygger sitet til Windows/IIS (Simply.com) ved hver push til main og:
#  1. gemmer det som en zip under "Artifacts" (til upload med FTP), og
#  2. lægger det færdige site på grenen "release" (til Simply's "Importer fra Git").
# Grenen "release" indeholder kun det byggede site – én commit, som erstattes ved hver udgivelse.
#
# Runtime: Simply.com's app-pool kører 32-bit, så standard er win-x86 (win-x64 giver HTTP 500.32).
# Kan overstyres med repo-variablen RUNTIME (Settings → Secrets and variables → Actions → Variables).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime:
        description: "Runtime (Simply.com bruger win-x86)"
        type: choice
        options: [win-x86, win-x64]
        default: win-x86

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNTIME: ${{ inputs.runtime || vars.RUNTIME || 'win-x86' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tjek at wwwroot/js er bygget fra Scripts/*.ts
        run: |
          npm ci --no-audit --no-fund
          npm run build:ts
          git diff --exit-code -- src/Tumlegaarden.Web/wwwroot/js || { echo "::error::wwwroot/js passer ikke til Scripts/*.ts – kør 'npm run build:ts' og commit."; exit 1; }

      - name: Opdater listen over danske IP-adresser
        run: ./tools/update-dk-ip-ranges.sh || echo "::warning::Kunne ikke hente nye IP-data – bruger listen fra repoet."

      - name: Test
        run: dotnet test tests/Tumlegaarden.Tests --configuration Release

      - name: Byg og udgiv
        run: dotnet publish src/Tumlegaarden.Web -c Release -r "$RUNTIME" --self-contained -o publish

      - name: Kontrollér pakken
        run: |
          test -f publish/web.config
          test -f publish/Tumlegaarden.Web.exe
          test -f publish/wwwroot/js/chat.js
          test -f publish/wwwroot/js/forms.js
          test -f publish/wwwroot/js/game.js
          test "$(grep -vc '^#' publish/GameData/ord-gyldige.txt)" -gt 9000
          test "$(grep -vc '^#' publish/GameData/ord-dagens.txt)" -gt 300
          test ! -f publish/tsconfig.json
          grep -q enableShadowCopy publish/web.config
          grep -q 'stdoutLogEnabled="true"' publish/web.config
          # <location path="..."> ud over "." fjerner ASP.NET-handleren for stien på Simply's IIS (HTTP 404.0).
          test "$(grep -cE '^[[:space:]]*<location path=' publish/web.config)" -eq 1
          test "$(grep -vc '^#' publish/GeoData/dk-ip-ranges.csv)" -gt 1000
          test ! -f publish/appsettings.Production.json
          test ! -f publish/appsettings.Development.json

      - name: Versionsinfo
        run: |
          {
            echo "Tumlegaarden"
            echo "Commit:  $GITHUB_SHA"
            echo "Runtime: $RUNTIME"
            echo "Bygget:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > publish/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tumlegaarden-${{ env.RUNTIME }}
          path: publish/
          retention-days: 30

      - name: Udgiv til grenen release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd publish
          git init -q -b release
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Udgivelse af ${GITHUB_SHA::7} ($RUNTIME)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
